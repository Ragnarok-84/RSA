[project]
name = "rsasig"
version = "1.0.0"
description = "Hệ chữ ký điện tử RSA ký trên giá trị băm SHA-256 — tự cài đặt, có bản thu nhỏ và các kịch bản tấn công"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "cryptography>=41.0"]

[project.scripts]
rsasig = "rsasig.ui.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["slow: kiểm thử chạy lâu (RSA-2048, băm 1 MB)"]
